# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup in the repository: Settings → Pages → Build and deployment
# → Source: "GitHub Actions". The site then lives at
# https://azam-stack.github.io/flowa-website/ (or the custom domain, once set).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Sub-path when served from <user>.github.io/<repo>/. Set to "/"
          # (or remove) once the site runs on its own domain.
          VITE_BASE: /flowa-website/
          # Lead endpoint (backend/ worker), booking link and analytics sink (see README).
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
