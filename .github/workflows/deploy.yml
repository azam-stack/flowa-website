# Builds flowa.dk and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Source: "GitHub Actions", custom domain flowa.dk
# (public/CNAME ships with the build).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served at the domain root, indexed, with a sitemap.
          VITE_BASE: /
          VITE_SITE_URL: https://flowa.dk
          VITE_DRAFT: "false"
          # Optional overrides (Settings → Variables). Unset = the defaults in src/config/site.ts.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_ASK_ENDPOINT: ${{ vars.VITE_ASK_ENDPOINT || 'https://flowa-contact.a-zam.workers.dev/api/ask' }}
          VITE_CLIENT_DASHBOARD_URL: ${{ vars.VITE_CLIENT_DASHBOARD_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
